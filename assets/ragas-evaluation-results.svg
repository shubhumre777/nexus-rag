 <linearGradient id="c" x1="0" x2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#6ee7b7"/></linearGradient>
 <linearGradient id="d" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="690" rx="30" fill="url(#bg)"/>
<circle cx="1090" cy="70" r="120" fill="#7c3aed" opacity=".13" filter="url(#shadow)"/>
