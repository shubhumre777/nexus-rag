<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">NEXUS RAG first RAGAS evaluation results</title>
<desc id="desc">Faithfulness 0.792 and answer relevancy 0.835 evaluated on six questions. Context precision and context recall both 1.000, evaluated on three answerable questions.</desc>
