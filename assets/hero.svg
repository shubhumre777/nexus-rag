<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS RAG</title>
  <desc id="desc">Document intelligence, reimagined.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1b2d"/>
      <stop offset="100%" stop-color="#10102b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="48%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="320" rx="24" fill="url(#bg)"/>
  <ellipse cx="700" cy="130" rx="590" ry="180" fill="url(#halo)"/>
  <path d="M90 252 H1310" stroke="#38bdf8" stroke-opacity=".25" stroke-width="1"/>
  <text x="700" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="106" font-weight="800" letter-spacing="5"
        fill="url(#titleGrad)" filter="url(#glow)">NEXUS RAG</text>
  <text x="700" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="25" font-weight="500" letter-spacing="3" fill="#dbeafe">
    DOCUMENT INTELLIGENCE, REIMAGINED
  </text>
  <text x="700" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="15" letter-spacing="1.1" fill="#93a4b8">
    UPLOAD  •  RETRIEVE  •  ASK  •  GET GROUNDED ANSWERS
  </text>
</svg>