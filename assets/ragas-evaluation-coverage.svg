<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">NEXUS RAG evaluation coverage and configuration</title>
<desc id="desc">Six questions were evaluated: three answerable and three unanswerable. Four RAGAS metrics were calculated. The RAG configuration used hybrid FAISS and BM25 retrieval with equal weights and top five.</desc>
